# cargo-deny policy — https://embarkstudios.github.io/cargo-deny/
# Wired into githooks/pre-push via `just deps`; CI runs `just deps` and the
# scheduled security workflow runs cargo deny.

[graph]
# collect metadata with all features so no platform/feature dep tree is missed
all-features = true

[licenses]
version = 2
# The allowlist is deliberately wider than this template's empty dependency
# graph; an allowance nothing exercises yet is not a policy failure.
unused-allowed-license = "allow"
# permissive licenses accepted for dependencies; extend as needed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
