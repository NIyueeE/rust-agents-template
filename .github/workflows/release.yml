name: Release

# Tag-driven releases only (AGENTS.md §5): pushing a `v*` tag is the single
# release trigger. The tag must name Cargo.toml's version, carry a dated
# CHANGELOG section with prose, sit on main, and pass the deterministic gates
# and dependency policy before anything is built. A draft release is created
# first; the GitHub Release is published only after every binary, checksum and
# the GHCR image are ready. A failed platform or image therefore leaves a
# draft, never a partial public release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release is a deliberate, single act: two tag pushes (or a re-push while a
# release is still running) must not race on the GitHub Release, its assets or
# the GHCR `latest` tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          components: clippy,rustfmt

      - name: Install dependency tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete,cargo-audit,cargo-deny

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Verify the tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          echo "ok: $GITHUB_REF_NAME is on main"

      - name: Verify version matches Cargo.toml
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Mismatch: Cargo.toml version=$CARGO_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "ok: tag $GITHUB_REF_NAME matches Cargo.toml version $CARGO_VERSION"

      - name: Verify CHANGELOG section (single source of release notes)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The same invariants githooks/pre-tag enforces locally: *exactly one*
          # dated `## [x.y.z] - YYYY-MM-DD` heading, a body that contains prose,
          # and an empty `## [Unreleased]`. A laxer check here would let a
          # hookless tag push ship an undated section — or, as one real defect
          # did, publish a stray empty duplicate that the extractor picks first.
          SECTIONS="$(grep -cE "^## \\[$VERSION\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)"
          if [ "$SECTIONS" -ne 1 ]; then
            echo "::error::CHANGELOG.md needs exactly one dated '## [$VERSION] - YYYY-MM-DD' section (found $SECTIONS)."
            exit 1
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" {insec=1; next}
            insec && /^## / {exit}
            insec {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -qE '^[^#[:space:]]' release-notes.md; then
            echo "::error::The '## [$VERSION]' section has no prose (headings only)."
            exit 1
          fi
          if awk '/^## \[Unreleased\]/{f=1;next} f&&/^## /{exit} f{print}' CHANGELOG.md \
              | grep -qE '^[^[:space:]]'; then
            echo "::error::'## [Unreleased]' still has content; move it into the dated section before tagging."
            exit 1
          fi
          echo "ok: one dated section with prose; [Unreleased] is empty"

      - name: Verify Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Deterministic gates (fmt/docs/clippy/test --locked)
        run: just verify

      - name: Dependency policy (machete/audit/deny)
        run: just deps

  create-release:
    name: create draft release
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release notes are extracted from CHANGELOG.md (Keep a Changelog format).
      # The check job above has already proved the section is unique, dated and
      # has prose; the extraction repeats the same date-aware matcher so the
      # notes cannot come from a different section shape.
      - name: Create draft release with notes extracted from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" {insec=1; next}
            insec && /^## / {exit}
            insec {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' section. Add it before tagging."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --draft
          fi

  upload:
    name: build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # A failing platform must not cancel the others: the release question is
      # whether every artifact builds, and a draft stays unpublished otherwise.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml resolves the stable toolchain; the job adds the matrix target
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: rust-agents-template
          target: ${{ matrix.target }}
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
          include: LICENSE,LICENSE-MIT,LICENSE-APACHE,README.md,CHANGELOG.md

  image:
    name: publish GHCR image
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the static musl binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p bin/amd64
          cp target/x86_64-unknown-linux-musl/release/rust-agents-template bin/amd64/

      - name: Build and smoke-test the image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker build --build-arg TARGETARCH=amd64 -f Containerfile \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" .
          docker run --rm "$IMAGE:$GITHUB_REF_NAME" | grep -q 'Hello, world!'

      - name: Push the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:latest"

  publish:
    name: publish release
    needs: [create-release, upload, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "published $GITHUB_REF_NAME"
