name: Release

# Tag-driven releases only (AGENTS.md §5): pushing a `v*` tag is the single
# release trigger. The tag must name Cargo.toml's version, carry a dated
# CHANGELOG section with prose, sit on main, and pass the deterministic gates
# and dependency policy before anything is built. A draft release is created
# first; the GitHub Release is published only after every binary, checksum,
# SBOM, attestation and the GHCR image are ready. A failed platform or image
# therefore leaves a draft, never a partial public release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release is a deliberate, single act: two tag pushes (or a re-push while a
# release is still running) must not race on the GitHub Release, its assets or
# the GHCR `latest` tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan release matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bin: ${{ steps.plan.outputs.bin }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan binary and targets
        id: plan
        run: |
          set -euo pipefail
          bin="$(sed -n 's/^name = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$bin" ] || { echo "::error::Cargo.toml has no package name"; exit 1; }
          matrix="$(jq -c '[.[] | select(.release == true)] | {include: .}' .github/targets.json)"
          count="$(jq '.include | length' <<<"$matrix")"
          if [ "$count" -eq 0 ]; then
            echo "::error::.github/targets.json has no release targets"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "planned $count release target(s): $matrix"

  check:
    name: release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy,rustfmt
          tools: cargo-machete,cargo-audit,cargo-deny
          install-just: "true"

      - name: Verify the tag commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
          echo "ok: $GITHUB_REF_NAME is on main"

      - name: Verify version matches Cargo.toml
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Mismatch: Cargo.toml version=$CARGO_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "ok: tag $GITHUB_REF_NAME matches Cargo.toml version $CARGO_VERSION"

      - name: Verify CHANGELOG section (single source of release notes)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # The same invariants githooks/pre-tag enforces locally: exactly one
          # dated `## [x.y.z] - YYYY-MM-DD` heading, a body that contains prose,
          # and an empty `## [Unreleased]`. A laxer check here would let a
          # hookless tag push ship an undated section, or publish a stray empty
          # duplicate that the extractor picks first.
          SECTIONS="$(grep -cE "^## \\[$VERSION\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)"
          if [ "$SECTIONS" -ne 1 ]; then
            echo "::error::CHANGELOG.md needs exactly one dated '## [$VERSION] - YYYY-MM-DD' section (found $SECTIONS)."
            exit 1
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" {insec=1; next}
            insec && /^## / {exit}
            insec {print}
          ' CHANGELOG.md > release-notes.md
          if ! grep -qE '^[^#[:space:]]' release-notes.md; then
            echo "::error::The '## [$VERSION]' section has no prose (headings only)."
            exit 1
          fi
          if awk '/^## \[Unreleased\]/{f=1;next} f&&/^## /{exit} f{print}' CHANGELOG.md \
              | grep -qE '^[^[:space:]]'; then
            echo "::error::'## [Unreleased]' still has content; move it into the dated section before tagging."
            exit 1
          fi
          echo "ok: one dated section with prose; [Unreleased] is empty"

      - name: Verify Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: ./.github/actions/rust-gates
        with:
          verify: "true"
          deps: "true"

  create-release:
    name: create draft release
    needs: [check, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release notes are extracted from CHANGELOG.md (Keep a Changelog format).
      # The check job above has already proved the section is unique, dated and
      # has prose; the extraction repeats the same date-aware matcher so the
      # notes cannot come from a different section shape.
      - name: Create draft release with notes extracted from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" {insec=1; next}
            insec && /^## / {exit}
            insec {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' section. Add it before tagging."
            exit 1
          fi
          # A prerelease must not become GitHub's "Latest" release. The
          # `publish` job sets the latest marker after the draft is complete;
          # drafts themselves are never marked latest.
          prerelease=false
          case "$TAG" in
            *-*) prerelease=true ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to mutate it"
              exit 1
            fi
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
              --prerelease="$prerelease" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
              --draft --prerelease="$prerelease" --verify-tag
          fi

  upload:
    name: build ${{ matrix.id }}
    needs: [create-release, plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      # A failing platform must not cancel the others: the release question is
      # whether every artifact builds, and a draft stays unpublished otherwise.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: ${{ needs.plan.outputs.bin }}
          target: ${{ matrix.target }}
          build-tool: cargo
          locked: true
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
          include: LICENSE,LICENSE-MIT,LICENSE-APACHE,README.md,CHANGELOG.md

  sbom:
    name: generate SBOM
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --override-filename sbom.cdx --spec-version 1.6

      - name: Upload SBOM to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber

  image:
    name: publish GHCR image
    needs: upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          targets: x86_64-unknown-linux-musl
          install-just: "true"

      - uses: ./.github/actions/rust-gates
        with:
          image: "true"
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}

      - name: Push the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            docker tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "prerelease: GHCR latest tag left unchanged"
          fi

  attest:
    name: attest release assets
    needs: [upload, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" --dir dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish release
    needs: [create-release, upload, image, sbom, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "release $TAG is already published; nothing to do"
            exit 0
          fi
          prerelease=false
          latest=true
          case "$TAG" in
            *-*) prerelease=true; latest=false ;;
          esac
          gh release edit "$TAG" --draft=false --prerelease="$prerelease" --latest="$latest" --verify-tag
          echo "published $TAG (prerelease=$prerelease, latest=$latest)"
