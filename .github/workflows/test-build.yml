name: Test build

# CD test builds: compile the binary for chosen platforms at an arbitrary
# commit WITHOUT creating a release. See AGENTS.md §6 and docs/release.md.
# Releases are tag-driven only (release.yml); this workflow never publishes.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA, branch, or tag to build"
        required: false
        default: "main"
      targets:
        description: "Platform groups, comma-separated (linux, macos, windows)"
        required: false
        default: "linux,macos,windows"

run-name: Test build ${{ inputs.ref }} [${{ inputs.targets }}]

permissions:
  contents: read

# One dispatch per ref and target set: a repeated linux build cancels itself,
# but a linux build and a windows build for the same ref can run side by side.
concurrency:
  group: test-build-${{ inputs.ref }}-${{ inputs.targets }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bin: ${{ steps.plan.outputs.bin }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix from .github/targets.json
        id: plan
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          bin="$(sed -n 's/^name = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          [ -n "$bin" ] || { echo "::error::Cargo.toml has no package name"; exit 1; }
          matrix="$(jq -c --arg requested "$REQUESTED" '
            ($requested | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $groups
            | [.[] | select(.test_build == true) | select(.group as $g | $groups | index($g))]
            | {include: .}
          ' .github/targets.json)"
          count="$(jq '.include | length' <<<"$matrix")"
          if [ "$count" -eq 0 ]; then
            echo "::error::no target matched '$REQUESTED'; use linux, macos, windows"
            exit 1
          fi
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "planned $count target(s): $matrix"

  build:
    name: build ${{ matrix.id }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Upload test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build-${{ matrix.id }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/${{ needs.plan.outputs.bin }}
            target/${{ matrix.target }}/release/${{ needs.plan.outputs.bin }}.exe
          if-no-files-found: error
          retention-days: 7
