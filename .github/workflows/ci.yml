name: CI

# Every PR and every push to main is classified by githooks/docs-only, the
# same script the local hooks use. The Rust chain is context-free (`just
# verify` / `just deps` / `just build-release`), so CI does not inherit the
# hooks' staged-diff or stdin assumptions. The diff secret scan is a CI step
# of its own. All paths report through one always-present `full check chain`
# gate, so branch protection has a required context even for docs-only changes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # On main, every commit gets its own group so a faster merge cannot cancel an
  # earlier run's diagnosis; elsewhere one group per ref is enough.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: classify change set
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      range: ${{ steps.classify.outputs.range }}
    steps:
      # Full history: the classifier diffs the pushed/base commit against HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify with githooks/docs-only
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          zeros="0000000000000000000000000000000000000000"
          head="$GITHUB_SHA"
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "$zeros" ]; then
            # A new branch has nothing to diff against: scan the whole commit.
            base="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          else
            base="$BASE_SHA"
          fi
          range="$base..$head"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          changed="$(mktemp)"
          if ! git diff --name-only "$range" > "$changed"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "cannot diff $range; running the full chain"
            exit 0
          fi
          if githooks/docs-only < "$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "docs-only change: skipping the Rust chain, running docs and lint"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "change touches code: running the full chain"
          fi

  code:
    name: rust gates
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan needs the base commit from the classified range.
          fetch-depth: 0

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy,rustfmt
          tools: cargo-machete,cargo-audit,cargo-deny
          install-just: "true"

      - name: Secret scan (PR/push diff)
        env:
          RANGE: ${{ needs.changes.outputs.range }}
        run: githooks/check-secrets "$RANGE"

      - uses: ./.github/actions/rust-gates
        with:
          verify: "true"
          build-release: "true"
          deps: "true"
          image: "true"
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}

  platform:
    name: platform tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/rust-setup
        with:
          cache-key: ${{ matrix.os }}

      - name: Run tests
        run: cargo test --locked

  docs:
    name: docs alignment
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan (docs diff)
        env:
          RANGE: ${{ needs.changes.outputs.range }}
        run: githooks/check-secrets "$RANGE"

      # Pure git/grep/sed/awk: no toolchain, seconds to run.
      - name: Docs alignment (githooks/check-docs)
        run: githooks/check-docs

  lint:
    name: workflow and hook lint
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-docs self-test clones this checkout.
          fetch-depth: 0

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" actionlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: shellcheck -x githooks/* tests/check-docs.sh

      - name: check-docs self-test
        run: tests/check-docs.sh

  gate:
    # The single required context: branch protection on main requires
    # "full check chain", and this job always runs (even when one of the two
    # paths above is skipped), so a docs-only PR cannot get stuck waiting for
    # a check that never appears.
    name: full check chain
    needs: [changes, code, platform, docs, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the chain for this change set
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_RESULT: ${{ needs.code.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::the change-set classifier did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [ -z "$DOCS_ONLY" ]; then
            echo "::error::the change-set classifier produced no docs_only result"
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::workflow/hook lint did not succeed ($LINT_RESULT)"
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            if [ "$DOCS_RESULT" != "success" ]; then
              echo "::error::docs-only change: the docs alignment gate did not succeed ($DOCS_RESULT)"
              exit 1
            fi
            echo "ok: docs-only change; docs alignment and lint passed"
          else
            if [ "$CODE_RESULT" != "success" ]; then
              echo "::error::code change: the Rust chain did not succeed ($CODE_RESULT)"
              exit 1
            fi
            if [ "$PLATFORM_RESULT" != "success" ]; then
              echo "::error::code change: platform tests did not succeed ($PLATFORM_RESULT)"
              exit 1
            fi
            echo "ok: code change; Rust chain, platform tests and lint passed"
          fi
