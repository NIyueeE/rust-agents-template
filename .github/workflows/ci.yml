name: CI

# The workflow triggers on every PR and every push to main; the change set is
# classified inside it by githooks/docs-only, the same script the local hooks
# use. A docs-only change runs the docs gate and skips the Rust chain; any
# other change runs the full chain (which includes the docs gate). Both paths
# report through the single `full check chain` job below, so branch protection
# has one required context that is always produced — workflow-level
# paths-ignore would leave that context missing on docs-only PRs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # On main, every commit gets its own group so a faster merge cannot cancel an
  # earlier run's diagnosis; elsewhere one group per ref is enough.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify change set
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs the pushed/base commit against HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify with githooks/docs-only
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          zeros="0000000000000000000000000000000000000000"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zeros" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "no base commit to diff; running the full chain"
            exit 0
          fi
          changed="$(mktemp)"
          if ! git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > "$changed"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "cannot diff $BASE_SHA..$GITHUB_SHA; running the full chain"
            exit 0
          fi
          if githooks/docs-only < "$changed"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "docs-only change: skipping the Rust chain, running the docs gate"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "change touches code: running the full chain"
          fi

  code:
    name: rust gates
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (supply-chain hardening); Dependabot
      # tracks the "# vX" comments. See AGENTS.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml (channel = stable + clippy/rustfmt) resolves
      # automatically; the pin freezes the action code, not the toolchain.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install check tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete,cargo-audit,cargo-outdated,cargo-deny

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Full check chain (fmt/secrets/machete/docs/clippy + audit/deny/outdated/test)
        run: just check

  docs:
    name: docs alignment
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pure git/grep/sed/awk: no toolchain, seconds to run.
      - name: Docs alignment (githooks/check-docs)
        run: githooks/check-docs

  gate:
    # The single required context: branch protection on main requires
    # "full check chain", and this job always runs (even when one of the two
    # paths above is skipped), so a docs-only PR cannot get stuck waiting for
    # a check that never appears.
    name: full check chain
    needs: [changes, code, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the chain for this change set
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_RESULT: ${{ needs.code.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::the change-set classifier did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [ -z "$DOCS_ONLY" ]; then
            echo "::error::the change-set classifier produced no docs_only result"
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            if [ "$DOCS_RESULT" != "success" ]; then
              echo "::error::docs-only change: the docs alignment gate did not succeed ($DOCS_RESULT)"
              exit 1
            fi
            echo "ok: docs-only change; docs alignment passed"
          else
            if [ "$CODE_RESULT" != "success" ]; then
              echo "::error::code change: the Rust chain did not succeed ($CODE_RESULT)"
              exit 1
            fi
            echo "ok: code change; the full Rust chain passed"
          fi
