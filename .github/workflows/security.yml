name: Security

# Advisories appear after the last push, so the blocking chain cannot be the
# only audit. This workflow re-checks the unchanged tree on a schedule; the
# freshness line is advisory and never fails the job.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head

      - name: Install audit tools
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit,cargo-deny,cargo-outdated

      - name: cargo audit
        run: cargo audit

      - name: cargo deny
        run: cargo deny check

      - name: dependency freshness (advisory)
        continue-on-error: true
        run: cargo outdated --root-deps-only
