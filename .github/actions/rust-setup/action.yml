name: Rust setup
description: Install the Rust toolchain, cache, dependency tools and just.

inputs:
  targets:
    description: Rust target; empty means the host target.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components; empty means none.
    required: false
    default: ""
  tools:
    description: Comma-separated cargo tools; empty installs none.
    required: false
    default: ""
  install-just:
    description: Install the just task runner.
    required: false
    default: "false"
  cache-key:
    description: Additional rust-cache key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}

    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      if: inputs.tools != ''
      with:
        tool: ${{ inputs.tools }}

    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      if: inputs.install-just == 'true'
